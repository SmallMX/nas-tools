name: nas-tools

services:
  nas-tools:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${NASTOOL_IMAGE:-nas-tools:local}
    container_name: nas-tools
    hostname: nas-tools
    ports:
      - "${NASTOOL_BIND_ADDRESS:-0.0.0.0}:${NASTOOL_PORT:-3000}:3000"
    volumes:
      - "${NASTOOL_CONFIG_DIR:-./config}:/config"
      - "${NASTOOL_MEDIA_DIR:-./media}:/downloads"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NASTOOL_BIND_ADDRESS: "${NASTOOL_BIND_ADDRESS:-0.0.0.0}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "${UMASK:-022}"
      NASTOOL_WEB_THREADS: "${NASTOOL_WEB_THREADS:-8}"
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  default:
    name: ${NASTOOL_NETWORK:-nas-tools}
    external: ${NASTOOL_NETWORK_EXTERNAL:-false}
