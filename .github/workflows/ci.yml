name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.19

      - name: Verify lock and install dependencies
        run: |
          uv lock --check
          uv sync --locked --no-dev --no-install-project

      - name: Static checks
        run: |
          .venv/bin/python -m compileall -q app web tests config.py check_config.py run.py
          /bin/sh -n docker/entrypoint.sh
          docker compose -f docker/compose.yml config --quiet
          find web/static -type f -name '*.js' \
            ! -name '*.min.js' ! -name 'ace.js' ! -name 'worker-*.js' \
            ! -name 'mode-*.js' ! -name 'theme-*.js' \
            -print0 | xargs -0 -n1 node --check

      - name: Unit tests
        run: .venv/bin/python tests/run.py

  container-smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build and start Compose service
        run: docker compose -f docker/compose.yml up -d --build --wait --wait-timeout 180

      - name: Verify HTTP endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:3000/healthz > /dev/null

      - name: Verify media volume permissions
        run: docker compose -f docker/compose.yml exec -T --user 1000:1000 nas-tools sh -c 'touch /downloads/.nas-tools-write-smoke && rm /downloads/.nas-tools-write-smoke'

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml logs --no-color

      - name: Stop Compose service
        if: always()
        run: docker compose -f docker/compose.yml down --volumes --remove-orphans
