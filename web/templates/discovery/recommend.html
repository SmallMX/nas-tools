{% import 'macro/form.html' as FORM %}
{% set IsDiscovery = Type in ['STREAMING', 'DISCOVER'] %}
<div class="container-xl{% if IsDiscovery %} nt-explore-page{% endif %}">
  {% if IsDiscovery %}
  <h1 class="visually-hidden" id="recommend_title">{{ Title }}</h1>
  <discovery-navigation active-source="{{ SubType if Type == 'STREAMING' else 'tmdb' }}"></discovery-navigation>
  <discovery-filters mode="{{ 'streaming' if Type == 'STREAMING' else 'tmdb' }}"
                     provider="{{ SubType if Type == 'STREAMING' else '' }}"
                     page="{{ 'tmdb_tv' if SubType == 'TV' else 'tmdb_movie' }}"
                     filter-config='{{ (FilterConf or {})|tojson }}'
                     params='{{ (Params or {})|tojson }}'></discovery-filters>
  {% else %}
  <!-- Page title -->
  <div class="nt-discovery-header d-print-none">
    <div class="row align-items-center">
      <div class="col">
        <div class="nt-discovery-eyebrow">探索 · MEDIA COLLECTION</div>
        <h1 class="nt-discovery-title" id="recommend_title"></h1>
        <p class="nt-discovery-description" id="recommend_subtitle"></p>
      </div>
      <div class="col-auto ms-auto d-print-none">
        <div class="btn-list">
          {{ FORM.gen_recommend_filter_dropdown(FilterConf, Params) }}
        </div>
      </div>
    </div>
  </div>
  {% endif %}
</div>
<!-- 业务页面代码 -->
<div class="page-body{% if IsDiscovery %} nt-explore-body{% endif %}">
  <div class="container-xl">
    <div class="d-grid gap-3 grid-media-card" id="recommend_content" aria-label="影视列表" aria-busy="false"></div>
    <div class="d-flex flex-column align-items-center gap-3 py-4">
      <p class="text-muted m-0" id="recommend_status" role="status" aria-live="polite"></p>
      <button type="button" class="btn btn-outline-primary" id="recommend_load_more" data-nt-click="recommend-load-more" hidden>加载更多</button>
    </div>
  </div>
</div>
<script type="text/javascript">
(() => {
  // 当前页码
  let CurrentPage = {{ (CurrentPage or 1)|tojson }};

  // 类型
  // MOV/TV/BANGUMI/SEARCH/DOWNLOADED/TRENDING/DISCOVER/DOUBANTAG/STREAMING
  const Type = {{ (Type or "")|tojson }};

  // 子类型
  const SubType = {{ (SubType or "")|tojson }};

  // 标题
  const Title = {{ (Title or "")|tojson }};
  $("#recommend_title").text(Title || "发现影视");

  // 子标题
  const SubTitle = {{ (SubTitle or "")|tojson }};
  if (SubTitle) {
    $("#recommend_subtitle").text(SubTitle).show();
  } else {
    $("#recommend_subtitle").text("浏览感兴趣的作品，结合筛选条件发现下一部收藏。");
  }

  // 星期
  const Week = {{ (Week or "")|tojson }};

  // TMDBID
  const TmdbId = {{ (TmdbId or "")|tojson }};

  // 演员ID
  const PersonId = {{ (PersonId or "")|tojson }};

  // 关键字
  const Keyword = {{ (Keyword or "")|tojson }};

  // 来源
  const Source = {{ (Source or "")|tojson }};

  // 过滤器
  const Filter = {{ (Filter or "")|tojson }};

  // 过滤参数
  const Params = {{ (Params or {})|tojson }};

  // 插入N个占位卡片 代替loading动画
  var page_card_num = 20;
  function add_loading_card_placeholder() {
    const container = document.getElementById("recommend_content");
    if (!container) {
      return;
    }
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < page_card_num; i++) {
      const placeholderContainer = document.createElement("div");
      placeholderContainer.dataset.loadingPlaceholder = "true";
      placeholderContainer.appendChild(document.createElement("normal-card-placeholder"));
      fragment.appendChild(placeholderContainer);
    }
    container.appendChild(fragment);
  }

  // 移除占位卡片
  function del_loading_card_placeholder() {
    document.querySelectorAll("#recommend_content [data-loading-placeholder]").forEach((element) => {
      element.remove();
    });
  }

  function create_recommend_card(item) {
    const card = document.createElement("normal-card");
    if (Type === "STREAMING" && item.source_id) card.dataset.sourceId = String(item.source_id);
    const attributes = {
      "card-tmdbid": item.id,
      "card-detail-url": Type === "STREAMING" ? item.detail_url : undefined,
      "card-mediatype": item.type,
      "card-showsub": "1",
      "card-image": item.image,
      "card-weekday": item.weekday,
      "card-vote": item.vote,
      "card-year": item.year,
      "card-title": item.title,
      "card-overview": item.overview,
      "card-restype": item.media_type,
      "card-date": item.date,
      "card-site": item.site,
    };
    Object.entries(attributes).forEach(([name, value]) => {
      if (value !== undefined && value !== null) {
        card.setAttribute(name, String(value));
      }
    });
    return card;
  }


  // Keep pagination errors recoverable without triggering a retry loop on every scroll.
  const recommendContainer = document.getElementById("recommend_content");
  const restoredLoading = recommendContainer?.dataset.recommendLoading === "true";
  const restoredPage = Number(recommendContainer?.dataset.recommendPage);
  if (Number.isInteger(restoredPage) && restoredPage > 0) CurrentPage = restoredPage;
  var loading = false;
  var recommend_finished = recommendContainer?.dataset.recommendFinished === "true";
  var recommend_failed = recommendContainer?.dataset.recommendFailed === "true";
  const displayedSourceIds = new Set(Array.from(document.querySelectorAll("#recommend_content normal-card[data-source-id]"), card => card.dataset.sourceId));

  function save_recommend_state() {
    if (!recommendContainer) return;
    recommendContainer.dataset.recommendPage = String(CurrentPage);
    recommendContainer.dataset.recommendFinished = String(recommend_finished);
    recommendContainer.dataset.recommendFailed = String(recommend_failed);
    recommendContainer.dataset.recommendLoading = String(loading);
  }

  function update_recommend_status(message, actionLabel) {
    save_recommend_state();
    const status = document.getElementById("recommend_status");
    const button = document.getElementById("recommend_load_more");
    if (status) status.textContent = message;
    if (button) {
      button.hidden = !actionLabel;
      button.disabled = loading;
      button.textContent = actionLabel || "加载更多";
    }
    document.getElementById("recommend_content")?.setAttribute("aria-busy", String(loading));
  }

  function loading_data() {
    if (loading || recommend_finished || recommend_failed || CurrentPage > 10) return;
    const requestContainer = document.getElementById("recommend_content");
    if (!requestContainer) return;
    loading = true;
    add_loading_card_placeholder();
    update_recommend_status("正在加载影视…", "");
    NasToolsUI.pageAction("get_recommend", {
      "type": Type,
      "subtype": SubType,
      "page": CurrentPage,
      "week": Week,
      "tmdbid": TmdbId,
      "personid": PersonId,
      "keyword": Keyword,
      "source": Source,
      "params": Params
    }, function (ret) {
      // A response from the previous page must never populate the current page.
      if (document.getElementById("recommend_content") !== requestContainer) return;
      loading = false;
      del_loading_card_placeholder();
      if (ret?.code !== 0 || !Array.isArray(ret.Items)) {
        recommend_failed = true;
        update_recommend_status(ret?.msg || "影视加载失败，请检查网络后重试。", "重新加载");
        return;
      }
      const items = ret.Items.filter(item => {
        if (Type !== "STREAMING" || !item?.source_id) return true;
        const id = String(item.source_id);
        if (displayedSourceIds.has(id)) return false;
        displayedSourceIds.add(id);
        return true;
      });
      if (items.length > 0 || ret.has_more === true) {
        CurrentPage++;
        sessionStorage.CurrentPage = CurrentPage;
        page_card_num = items.length || 20;
        const fragment = document.createDocumentFragment();
        for (const item of items) fragment.appendChild(create_recommend_card(item || {}));
        requestContainer.appendChild(fragment);
      } else {
        recommend_finished = true;
        if (!requestContainer.querySelector("normal-card")) {
          const emptyTemplate = document.getElementById("no_recommend_template");
          if (emptyTemplate) requestContainer.replaceChildren(emptyTemplate.content.cloneNode(true));
        }
      }
      if (ret.has_more === false) recommend_finished = true;
      const count = requestContainer.querySelectorAll("normal-card").length;
      const reachedLimit = CurrentPage > 10;
      update_recommend_status(
        reachedLimit ? `已显示 ${count} 部作品，可调整筛选条件发现更多。`
          : recommend_finished ? (count ? `已显示全部 ${count} 部作品。` : "")
          : `已显示 ${count} 部作品`,
        recommend_finished || reachedLimit ? "" : "加载更多"
      );
      window_history();
      if (items.length > 0 && !recommend_finished && !reachedLimit) loading_data_max();
    });
  }

  function loading_data_max() {
    const currentContainer = document.getElementById("recommend_content");
    NasToolsUI.pageTimeout(() => {
      if (document.getElementById("recommend_content") === currentContainer && !hasScrollbar()) loading_data();
    }, 200);
  }

  // History restores HTML, so pagination state must travel with that same container.
  // Pending requests belong to the old page version; resume their page after removing stale placeholders.
  del_loading_card_placeholder();
  if (!restoredPage && sessionStorage.CurrentPage && recommendContainer?.querySelector("normal-card")) {
    CurrentPage = Number(sessionStorage.CurrentPage) || 1;
  }
  save_recommend_state();
  recommendContainer?.setAttribute("aria-busy", "false");
  const loadMoreButton = document.getElementById("recommend_load_more");
  if (loadMoreButton) loadMoreButton.disabled = false;
  if (recommend_finished || recommend_failed) {
    if (loadMoreButton) loadMoreButton.hidden = recommend_finished;
  } else if (restoredLoading) {
    loading_data();
  } else if (recommendContainer?.querySelector("normal-card")) {
    loading_data_max();
  } else {
    CurrentPage = Number(CurrentPage) || 1;
    loading_data();
  }

  // 带过滤参数刷新页面
  function filter_refresh(filterkey, value) {
    Params[filterkey] = value;
    if (Type === "STREAMING" && filterkey === "category") Params.sort = "hot";
    const params = new URLSearchParams({
      type: String(Type || ""),
      subtype: String(SubType || ""),
      title: String(Title || ""),
      subtitle: String(SubTitle || ""),
      filter: String(Filter || ""),
      params: JSON.stringify(Params || {}),
    });
    if (Type === "STREAMING" && ["tencent", "iqiyi", "mgtv"].includes(SubType)) {
      navmenu(`${SubType}?${new URLSearchParams({params: JSON.stringify(Params)})}`);
    } else {
      navmenu(`recommend?${params.toString()}`);
    }
  }


  NasToolsUI.bindActions('#page_content', {click: {
    'recommend-filter': element => filter_refresh(...NasToolsUI.args(element)),
    'recommend-load-more': () => {
      recommend_failed = false;
      loading_data();
    }
  }});

  // 仅当前媒体列表响应滚动；局部导航不重复叠加处理器。
  $(window).off('scroll.recommend').on('scroll.recommend', ((container) => () => {
    if (document.getElementById('recommend_content') === container && getScrollRate() < 0.01) loading_data();
  })(document.getElementById('recommend_content')));

})();
</script>
<template id="no_recommend_template">
<div class="nt-media-state" role="status">
  <h2>暂时没有找到作品</h2>
  <p>试试调整筛选条件，或换个关键词继续探索。</p>
</div>
</template>
