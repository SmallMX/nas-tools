{% import 'macro/oops.html' as OOPS %}
{% import 'macro/form.html' as FORM %}
<div class="container-xl">
  <!-- Page title -->
  <div class="page-header d-print-none">
    <div class="row align-items-center">
      <div class="col">
        <h2 class="page-title" id="recommend_title"></h2>
        <div class="text-muted mt-1" id="recommend_subtitle"></div>
      </div>
      <div class="col-auto ms-auto d-print-none">
        <div class="btn-list">
          {{ FORM.gen_recommend_filter_dropdown(FilterConf, Params) }}
        </div>
      </div>
    </div>
  </div>
</div>
<!-- 业务页面代码 -->
<div class="page-body">
  <div class="container-xl">
    <div class="d-grid gap-3 grid-media-card" id="recommend_content">
    </div>
  </div>
</div>
<script type="text/javascript">
  // 当前页码
  CurrentPage = {{ (CurrentPage or 1)|tojson }};

  // 类型
  // MOV/TV/BANGUMI/SEARCH/DOWNLOADED/TRENDING/DISCOVER/DOUBANTAG
  Type = {{ (Type or "")|tojson }};

  // 子类型
  SubType = {{ (SubType or "")|tojson }};

  // 标题
  Title = {{ (Title or "")|tojson }};
  $("#recommend_title").text(Title);

  // 子标题
  SubTitle = {{ (SubTitle or "")|tojson }};
  if (SubTitle) {
    $("#recommend_subtitle").text(SubTitle).show();
  } else {
    $("#recommend_subtitle").hide();
  }

  // 星期
  Week = {{ (Week or "")|tojson }};

  // TMDBID
  TmdbId = {{ (TmdbId or "")|tojson }};

  // 演员ID
  PersonId = {{ (PersonId or "")|tojson }};

  // 关键字
  Keyword = {{ (Keyword or "")|tojson }};

  // 来源
  Source = {{ (Source or "")|tojson }};

  // 过滤器
  Filter = {{ (Filter or "")|tojson }};

  // 过滤参数
  Params = {{ (Params or {})|tojson }};

  // 插入N个占位卡片 代替loading动画
  var page_card_num = 20;
  function add_loading_card_placeholder() {
    const container = document.getElementById("recommend_content");
    if (!container) {
      return;
    }
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < page_card_num; i++) {
      const placeholderContainer = document.createElement("div");
      placeholderContainer.dataset.loadingPlaceholder = "true";
      placeholderContainer.appendChild(document.createElement("normal-card-placeholder"));
      fragment.appendChild(placeholderContainer);
    }
    container.appendChild(fragment);
  }

  // 移除占位卡片
  function del_loading_card_placeholder() {
    document.querySelectorAll("#recommend_content [data-loading-placeholder]").forEach((element) => {
      element.remove();
    });
  }

  function create_recommend_card(item) {
    const card = document.createElement("normal-card");
    const attributes = {
      "card-tmdbid": item.id,
      "card-mediatype": item.type,
      "card-showsub": "1",
      "card-image": item.image,
      "card-weekday": item.weekday,
      "card-vote": item.vote,
      "card-year": item.year,
      "card-title": item.title,
      "card-overview": item.overview,
      "card-restype": item.media_type,
      "card-date": item.date,
      "card-site": item.site,
    };
    Object.entries(attributes).forEach(([name, value]) => {
      if (value !== undefined && value !== null) {
        card.setAttribute(name, String(value));
      }
    });
    return card;
  }


  //状态标记
  var loading = false;
  function loading_data() {
    if (loading || CurrentPage > 10) {
      return;
    }
    loading = true;
    add_loading_card_placeholder();
    ajax_post("get_recommend", {
      "type": Type,
      "subtype": SubType,
      "page": CurrentPage,
      "week": Week,
      "tmdbid": TmdbId,
      "personid": PersonId,
      "keyword": Keyword,
      "source": Source,
      "params": Params
    }, function (ret) {
      const items = Array.isArray(ret?.Items) ? ret.Items : [];
      loading = false;
      if (items.length > 0) {
        // 记录页码
        CurrentPage++;
        sessionStorage.CurrentPage = CurrentPage;
        page_card_num = items.length;
      } else {
        if (CurrentPage === 1) {
          const container = document.getElementById("recommend_content");
          const emptyTemplate = document.getElementById("no_recommend_template");
          container?.classList.remove("grid-media-card");
          if (container && emptyTemplate) {
            container.replaceChildren(emptyTemplate.content.cloneNode(true));
          }
        }
      }
      del_loading_card_placeholder();
      const container = document.getElementById("recommend_content");
      if (container && items.length > 0) {
        const fragment = document.createDocumentFragment();
        for (const item of items) {
          fragment.appendChild(create_recommend_card(item || {}));
        }
        container.appendChild(fragment);
      }
      window_history();
      if (items.length > 0) {
        loading_data_max();
      }
    });
  }


  // 如果没有滚动条则继续加载
  function loading_data_max() {
    // 加入延迟是因为需要确保组件已经完成渲染才能正确计算可滚动高度
    setTimeout(() => {
      if (!hasScrollbar()) {
        loading_data();
      }
    }, 200);
  }

  // 后退时sessionStorage.CurrentPage 未被清除, 则更新当前页码
  if (sessionStorage.CurrentPage) {
    CurrentPage = sessionStorage.CurrentPage;
    loading_data_max();
  } else {
    // 否则初始化数据
    loading_data();
  }

  // 带过滤参数刷新页面
  function filter_refresh(filterkey, value) {
    Params[filterkey] = value;
    const params = new URLSearchParams({
      type: String(Type || ""),
      subtype: String(SubType || ""),
      title: String(Title || ""),
      subtitle: String(SubTitle || ""),
      filter: String(Filter || ""),
      params: JSON.stringify(Params || {}),
    });
    navmenu(`recommend?${params.toString()}`);
  }


  // 滚动加载事件
  $(document).ready(function ($) {
    $(window).scroll(function(){
      if(getScrollRate() < 0.01){
        loading_data();
      }
    });
  });

</script>
<template id="no_recommend_template">
{{ OOPS.empty('没有数据。', '') }}
</template>
