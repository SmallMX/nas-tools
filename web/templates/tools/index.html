{% import 'macro/ui.html' as UI %}
{{ UI.page_header('工具', '集中处理常用任务，让日常维护更轻松。', eyebrow='工作空间') }}

{% if Tools %}
<div class="page-body">
  <div class="container-xl">
    <div class="row row-cards">
      {% for Tool in Tools %}
      <div class="col-sm-6 col-lg-4">
        <div class="card h-100 nt-tool-card">
          <div class="card-body d-flex gap-3">
            <span class="avatar bg-blue-lt">
              <img src="{{ url_for('static', filename='img/' ~ Tool.icon) }}" alt="">
            </span>
            <div class="flex-fill">
              <h3 class="card-title mb-1">{{ Tool.name }}</h3>
              <p class="text-muted mb-3">{{ Tool.description }}</p>
              <a class="btn btn-primary tool-open" href="/{{ Tool.page }}"
                 data-tool-page="{{ Tool.page }}">打开工具</a>
            </div>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% else %}
<div class="page-body">
  <div class="container-xl">
    {{ UI.empty_state('暂无可用工具', '当前没有已集成的工具。') }}
  </div>
</div>
{% endif %}

<script type="text/javascript">
  $(document).off("click.tool-open", ".tool-open").on(
    "click.tool-open",
    ".tool-open",
    function (event) {
      event.preventDefault();
      navmenu(this.dataset.toolPage || "tools");
    }
  );
</script>
