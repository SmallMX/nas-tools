{% import 'macro/ui.html' as UI %}
{% call UI.page_header('站点自动签到', '查看今日结果，优先处理待执行和失败站点。') %}
<div class="btn-list">
  <button class="btn btn-primary" id="site_signin_retry" type="button">执行待签与重试</button>
  <button class="btn" id="site_signin_refresh" type="button">刷新</button>
  <a class="btn" href="/?next=site" data-signin-page="site">站点维护</a>
  <button class="btn btn-outline-danger" id="site_signin_force" type="button">强制全部执行</button>
</div>
{% endcall %}

<div class="page-body">
  <div class="container-xl">
    <dl class="nt-signin-summary mb-3" id="site_signin_summary" aria-label="今日签到摘要">
      <div><dt class="nt-signin-stat-label">今日状态</dt><dd class="nt-signin-stat-value">正在加载...</dd></div>
    </dl>
    <p id="site_signin_target_notice" class="text-muted" role="status" hidden></p>

    <div class="card mb-3">
      <div class="card-header d-flex align-items-center">
        <h3 class="card-title">今日状态</h3>
        <span class="badge ms-auto" id="site_signin_running"></span>
      </div>
      <div class="table-responsive nt-table-region">
        <table class="table table-vcenter card-table">
          <thead>
            <tr>
              <th>站点</th>
              <th>任务</th>
              <th>状态</th>
              <th>结果</th>
              <th>时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="site_signin_items"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h3 class="card-title">最近执行记录</h3></div>
      <div class="table-responsive nt-table-region">
        <table class="table table-vcenter card-table">
          <thead>
            <tr>
              <th>执行时间</th>
              <th>站点</th>
              <th>任务</th>
              <th>结果</th>
              <th>耗时</th>
            </tr>
          </thead>
          <tbody id="site_signin_history"></tbody>
        </table>
      </div>
    </div>
    <details class="card nt-settings-disclosure mt-3" id="site_signin_settings">
      <summary class="nt-details-summary">执行策略与通知设置</summary>
      <div class="card-body">
        <p class="text-muted">签到和保号登录站点在“站点维护”中选择；此处只保存执行策略，不保存或展示站点 Cookie。</p>
        <div class="row">
          <div class="col-md-6 col-xl-3">
            <div class="mb-3">
              <label class="form-label" for="site_signin_cron">执行周期 <span class="form-help"
                title="支持小时间隔、固定时间或时间范围，例如 23.5、08:00、08:00-09:00；留空关闭定时执行。"
                data-bs-toggle="tooltip">?</span></label>
              <input class="form-control" id="site_signin_cron" type="text"
                     value="{{ ToolConfig.get('cron') or '' }}" placeholder="留空关闭定时执行" autocomplete="off">
            </div>
          </div>
          <div class="col-md-6 col-xl-3">
            <div class="mb-3">
              <label class="form-label" for="site_signin_concurrency">并发数</label>
              <input class="form-control" id="site_signin_concurrency" type="number" min="1" max="10"
                     value="{{ ToolConfig.get('concurrency', 5) }}">
            </div>
          </div>
          <div class="col-md-6 col-xl-3">
            <div class="mb-3">
              <label class="form-label" for="site_signin_history_days">历史保留天数</label>
              <input class="form-control" id="site_signin_history_days" type="number" min="7" max="365"
                     value="{{ ToolConfig.get('history_days', 30) }}">
            </div>
          </div>
          <div class="col-md-6 col-xl-3">
            <div class="mb-3">
              <label class="form-check form-switch mt-4">
                <input class="form-check-input" id="site_signin_notify" type="checkbox"
                       {% if ToolConfig.get('notify', true) %}checked{% endif %}>
                <span class="form-check-label">发送执行结果通知</span>
              </label>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-12">
            <div class="mb-0">
              <label class="form-label" for="site_signin_retry_keyword">失败重试关键词 <span class="form-help"
                title="支持正则表达式。当天执行失败且结果命中后，会在下一次调度时重试。"
                data-bs-toggle="tooltip">?</span></label>
              <input class="form-control" id="site_signin_retry_keyword" type="text"
                     value="{{ ToolConfig.get('retry_keyword') or '错误|失败|失效|无法|超时|Cloudflare' }}"
                     autocomplete="off">
            </div>
          </div>
        </div>
      </div>
      <div class="card-footer d-flex justify-content-end">
        <button class="btn btn-primary" id="site_signin_save" type="button">保存执行策略</button>
      </div>
    </details>
  </div>
</div>

<script type="text/javascript">
  (() => {
    const pageVersion = NasToolsUI.pageVersion;
    let followUpPolls = 0;
    let pollTimer = null;
    let running = false;
    let submitting = false;
    let targetFocused = false;
    const targetSiteId = {{ request.args.get('site_id', '')|tojson }};
    const targetSiteName = {{ request.args.get('site_name', '')|tojson }};
    const retryButton = document.querySelector("#site_signin_retry");
    const forceButton = document.querySelector("#site_signin_force");
    const text = (value) => document.createTextNode(value ?? "");

    function navigateToPage(event, page) {
      if (event.defaultPrevented || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      navmenu(page);
    }

    function sitePage(item) {
      const params = new URLSearchParams();
      if (item.site_id !== undefined && item.site_id !== null) params.set("site_id", String(item.site_id));
      if (item.site) params.set("site_name", item.site);
      return params.size ? `site?${params}` : "site";
    }

    function siteLink(item, label) {
      const link = document.createElement("a");
      const page = sitePage(item);
      link.href = `/?next=${encodeURIComponent(page)}`;
      link.textContent = label;
      link.setAttribute("aria-label", `维护站点：${item.site || "未命名站点"}`);
      link.addEventListener("click", (event) => navigateToPage(event, page));
      return link;
    }

    function updateRunControls() {
      retryButton.disabled = forceButton.disabled = running || submitting;
    }

    function cell(value, className = "") {
      const item = document.createElement("td");
      item.className = className;
      item.append(text(value));
      return item;
    }

    function badge(success) {
      const item = document.createElement("span");
      if (success === null) {
        item.className = "badge bg-secondary-lt";
        item.append(text("待执行"));
      } else if (success) {
        item.className = "badge bg-green-lt";
        item.append(text("成功"));
      } else {
        item.className = "badge bg-red-lt";
        item.append(text("失败"));
      }
      return item;
    }

    function emptyRow(message, columns) {
      const row = document.createElement("tr");
      const item = document.createElement("td");
      item.colSpan = columns;
      item.className = "text-center text-muted py-4";
      item.append(text(message));
      row.append(item);
      return row;
    }

    function renderSummary(summary) {
      const container = document.querySelector("#site_signin_summary");
      container.replaceChildren();
      [
        ["配置任务", summary.total ?? 0, "blue"],
        ["今日成功", summary.success ?? 0, "green"],
        ["今日失败", summary.failed ?? 0, "red"],
        ["今日待执行", summary.pending ?? 0, "yellow"],
      ].forEach(([label, value, color]) => {
        const group = document.createElement("div");
        const labelNode = document.createElement("dt");
        labelNode.className = "nt-signin-stat-label";
        labelNode.append(text(label));
        const valueNode = document.createElement("dd");
        valueNode.className = `nt-signin-stat-value text-${color}`;
        valueNode.append(text(String(value)));
        group.append(labelNode, valueNode);
        container.append(group);
      });
    }

    function renderItems(items) {
      const body = document.querySelector("#site_signin_items");
      body.replaceChildren();
      if (!items.length) {
        body.append(emptyRow("尚未配置签到或保号登录站点，请在站点维护中启用。", 6));
        showTargetNotice(false);
        return;
      }
      const priority = (item) => item.success === false ? 0 : item.success === null ? 1 : 2;
      let targetRow;
      [...items].sort((a, b) => priority(a) - priority(b)).forEach((item) => {
        const row = document.createElement("tr");
        const site = document.createElement("td");
        site.append(siteLink(item, item.site || "未命名站点"));
        row.append(site, cell(item.action_name));
        const status = document.createElement("td");
        status.append(badge(item.success));
        row.append(status, cell(item.message, item.success === false ? "text-danger" : ""), cell(item.created_at || "-"));
        const action = document.createElement("td");
        if (item.success === false) {
          const link = siteLink(item, "维护站点");
          link.className = "btn btn-sm";
          action.append(link);
        } else {
          action.append(text("—"));
        }
        row.append(action);
        const matchesTarget = targetSiteId && item.site_id !== undefined && item.site_id !== null
          ? String(item.site_id) === targetSiteId
          : Boolean(targetSiteName && item.site === targetSiteName);
        if (matchesTarget) {
          row.classList.add("nt-signin-target");
          row.tabIndex = -1;
          targetRow ||= row;
        }
        body.append(row);
      });
      showTargetNotice(Boolean(targetRow));
      if (targetRow && !targetFocused) {
        targetFocused = true;
        targetRow.focus({preventScroll: true});
        targetRow.scrollIntoView({block: "center"});
      }
    }

    function showTargetNotice(found) {
      const notice = document.querySelector("#site_signin_target_notice");
      notice.hidden = !targetSiteId && !targetSiteName;
      notice.textContent = found ? `已定位${targetSiteName ? `「${targetSiteName}」` : "所选站点"}的今日状态；下方仍显示全部任务。`
        : "当前签到任务中未找到所选站点，请在站点维护中检查签到或保号登录是否启用。";
    }

    function renderHistory(history) {
      const body = document.querySelector("#site_signin_history");
      body.replaceChildren();
      if (!history.length) {
        body.append(emptyRow("暂无执行记录", 5));
        return;
      }
      history.forEach((item) => {
        const row = document.createElement("tr");
        row.append(cell(item.created_at), cell(item.site), cell(item.action_name));
        const result = document.createElement("td");
        result.append(badge(item.success), text(` ${item.message}`));
        row.append(result, cell(`${item.duration} ms`));
        body.append(row);
      });
    }

    function schedulePoll(running) {
      window.clearTimeout(pollTimer);
      if (running || followUpPolls > 0) {
        if (!running) followUpPolls -= 1;
        pollTimer = NasToolsUI.pageTimeout(loadStatus, 2000);
      }
    }

    function loadStatus() {
      NasToolsUI.pageAction("tool_site_signin_status", {}, (ret) => {
        if (ret.code !== 0) {
          show_fail_modal(ret.msg || "签到状态加载失败");
          return;
        }
        renderSummary(ret.summary || {});
        renderItems(ret.items || []);
        renderHistory(ret.history || []);
        running = Boolean(ret.running);
        const runningLabel = document.querySelector("#site_signin_running");
        runningLabel.className = running ? "badge bg-blue-lt ms-auto" : "badge bg-green-lt ms-auto";
        runningLabel.textContent = running ? "运行中" : "空闲";
        updateRunControls();
        schedulePoll(running);
      }, true, false);
    }

    function runSignin(force) {
      if (NasToolsUI.pageVersion !== pageVersion || running || submitting) return;
      submitting = true;
      updateRunControls();
      return NasToolsUI.pageAction("tool_site_signin_run", {force}, (ret) => {
        if (ret.code !== 0) {
          show_fail_modal(ret.msg || "签到任务启动失败");
          loadStatus();
          return;
        }
        running = true;
        show_success_modal(ret.msg);
        followUpPolls = 5;
        NasToolsUI.pageTimeout(loadStatus, 500);
      }).finally(() => {
        submitting = false;
        updateRunControls();
      });
    }

    function saveConfig() {
      const button = document.querySelector("#site_signin_save");
      const config = input_select_GetVal("site_signin_settings", "site_signin_");
      NasToolsUI.withButton(button, "保存中...", () => NasToolsUI.pageAction("tool_site_signin_config_update", config, (ret) => {
        if (ret.code !== 0) {
          show_fail_modal(ret.msg || "工具设置保存失败");
          return;
        }
        show_success_modal(ret.msg || "工具设置已保存");
      }));
    }

    document.querySelector("#site_signin_refresh")?.addEventListener("click", loadStatus);
    document.querySelector("#site_signin_retry")?.addEventListener("click", () => runSignin(false));
    document.querySelector("#site_signin_force")?.addEventListener("click", () => {
      if (running || submitting) return;
      show_confirm_modal("强制执行所有已配置的签到和保号登录任务？今日已成功的站点也会再次执行。日常检查请优先使用“执行待签与重试”。", () => {
        hide_confirm_modal();
        runSignin(true);
      }, "强制全部执行");
    });
    document.querySelector("#site_signin_save")?.addEventListener("click", saveConfig);
    document.querySelectorAll("[data-signin-page]").forEach((link) => {
      link.addEventListener("click", (event) => navigateToPage(event, link.dataset.signinPage));
    });
    loadStatus();
  })();
</script>
