<script type="text/javascript">
  window.customElements.define("custom-chips",
  class extends HTMLElement {
    constructor() {
      super();
    }

    // 被载入文档时
    connectedCallback() {
      // 获取是否有属性值, 生成html
      // this.innerHTML == "" 表示当前是第一次初始化, 没有被重载
      if (this.innerHTML === ""){
        this.render(this.getArgs("data-type"), this.getArgs("data-text"), this.getArgs("data-href"));
      }
    }

    // 自定义方法, 按指定数组排序, 遍历字典, 一次性生成多个chips
    add_chips_all(sort_array, data_dict) {
      // 完全体应该 清空组件内容
      // this.innerHTML == ""
      // 开始遍历排序列表生成chips
      for (let key of sort_array) {
        let href = "";
        // 对特定的标签指定herf属性
        switch(key){
          case "name":
            href = (data_dict.name === "无法识别") ? null : `https://www.themoviedb.org/search?query=${encodeURI(data_dict.name)}`;
            break;
          case "tmdbid":
            href = data_dict.tmdblink;
            break;
          case "season_episode":
            href = data_dict.tmdb_S_E_link;
            break;
          case "title":
            data_dict.title = (!data_dict.tmdbid) ? "未匹配TMDB" : data_dict.title;
            break;
        }
        this.render(key, data_dict[key], href);
        this.style.display = "block";
      }
    }

    render(chips_type, chips_content, chips_href) {
      // 支持的标题
      const title = {
        type:"类型",
        category:"类别",
        name:"识别名称",
        title:"标题",
        tmdbid:"TMDB ID",
        year:"年份",
        season_episode:"季集",
        part:"分集",
        restype:"质量",
        effect:"特性",
        pix:"分辨率",
        video_codec:"视频编码",
        audio_codec:"音频编码",
        team:"制作组/字幕组",
      }
      // 所对应样式
      const color = {
        type:"bg-blue",
        category:"bg-blue",
        name:(chips_content === "无法识别") ? "bg-red text-wrap" :"bg-yellow text-wrap",
        title:(chips_content !== "未匹配TMDB") ? "bg-green" : "bg-red",
        tmdbid:"bg-green",
        year:"bg-orange",
        season_episode:"bg-orange",
        part:"bg-orange",
        restype:"",
        effect:"",
        pix:"",
        video_codec:"",
        audio_codec:"",
        team:"bg-cyan text-wrap",
      }
      if (chips_content && chips_type && title.hasOwnProperty(chips_type)) {
        let span_element = document.createElement("span");
        span_element.setAttribute("title", title[chips_type])
        let safe_href = null;
        if (chips_href) {
          try {
            const parsed = new URL(String(chips_href), window.location.origin);
            if (["http:", "https:"].includes(parsed.protocol)) safe_href = parsed.href;
          } catch (_) {
            safe_href = null;
          }
        }
        if (safe_href) {
          let a_element = document.createElement("a");
          a_element.setAttribute("class", `badge me-1 mb-1 ${color[chips_type]}`);
          a_element.setAttribute("href", safe_href);
          a_element.setAttribute("target", "_blank");
          a_element.setAttribute("rel", "noopener noreferrer");
          a_element.textContent = String(chips_content);
          span_element.appendChild(a_element);
        } else {
          span_element.setAttribute("class", `badge me-1 mb-1 ${color[chips_type]}`);
          span_element.textContent = String(chips_content);
        }
        this.appendChild(span_element);
        // 该组件不需要区分重载与初始化 直接赋值组件内部为空 并刷新内容
      }
    }

    getArgs(name, default_value) {
      if (!default_value) {
        default_value = "";
      }
      let value = this.getAttribute(name);
      if (!value || value == "None" || value == "null") {
        return default_value;
      } else {
        return value;
      }
    }
  });
</script>
